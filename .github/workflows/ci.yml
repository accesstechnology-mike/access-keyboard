name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select an iPhone simulator
        run: python3 scripts/select_iphone_simulator.py

      - name: Unit tests
        working-directory: Packages/AccessKeyboardCore
        run: |
          set -euo pipefail
          DEST="$(cat "$RUNNER_TEMP/simulator-destination.txt")"
          xcodebuild test \
            -scheme AccessKeyboardCore \
            -destination "$DEST" \
            -derivedDataPath "$RUNNER_TEMP/core-dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the app and keyboard extension
        run: |
          set -euo pipefail
          DEST="$(cat "$RUNNER_TEMP/simulator-destination.txt")"
          xcodebuild build \
            -project AccessKeyboard.xcodeproj \
            -scheme AccessKeyboard \
            -destination "$DEST" \
            -derivedDataPath "$RUNNER_TEMP/app-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
