name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "testflight-*"
      - "sync-testflight-*"

jobs:
  latest-only:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'sync-testflight-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check latest-only selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          mkdir -p secrets
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > secrets/AuthKey.p8

      - name: Give testers the latest build only
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: secrets/AuthKey.p8
        run: python3 scripts/app_store_connect.py latest-only

  upload:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'testflight-')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check latest-only selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Write local secrets
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          AK_FIX_PROXY_SECRET: ${{ secrets.AK_FIX_PROXY_SECRET }}
        run: |
          umask 077
          mkdir -p secrets
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > secrets/AuthKey.p8
          printf 'AK_FIX_PROXY_SECRET = %s\n' "$AK_FIX_PROXY_SECRET" > Secrets.xcconfig

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: secrets/AuthKey.p8
        run: sh scripts/upload-testflight.sh
